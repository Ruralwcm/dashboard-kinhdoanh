<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DailySale — WinMart+ Rural</title>
<link rel="icon" href="favicon.png"><link rel="apple-touch-icon" href="favicon.png">
<link rel="stylesheet" href="style.css">
<style>
  .seg{display:inline-flex;background:var(--bg2,#eef2f7);border:1px solid var(--line,#dce1e7);border-radius:9px;padding:2px;gap:2px}
  .seg button{border:0;background:transparent;padding:6px 14px;border-radius:7px;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--text2,#5b6675);font-family:inherit}
  .seg button.on{background:var(--navy,#1e3a8a);color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18)}
  .filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface,#fff);border:1px solid var(--line,#dce1e7);border-radius:11px;padding:9px 12px;margin-bottom:14px}
  .filters select,.filters input{font-family:inherit;font-size:12px;padding:6px 9px;border:1px solid var(--line,#dce1e7);border-radius:7px;background:var(--surface,#fff);color:var(--text,#16202c)}
  .kpi .sub2{font-size:10.5px;color:var(--text2,#5b6675);margin-top:3px;font-weight:500}
  table.tb{width:100%;border-collapse:collapse;font-size:12px}
  table.tb th{position:sticky;top:0;background:var(--bg2,#eef2f7);z-index:2;font-size:11px;text-transform:none;letter-spacing:.01em;color:var(--text2,#5b6675);padding:8px 9px;border-bottom:1px solid var(--line,#dce1e7);white-space:nowrap;cursor:pointer}
  table.tb td{padding:7px 9px;border-bottom:1px solid var(--line2,#eff2f6);white-space:nowrap}
  table.tb td.num,table.tb th.num{text-align:right}
  table.tb tr.grp td{background:var(--bg2,#e8eef6);font-weight:700;border-left:3px solid var(--navy,#1e3a8a)}
  table.tb tbody tr:hover td{background:rgba(59,130,246,.06)}
  .neg{color:#dc2626}.pos{color:#059669}
  .tag{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:20px;background:var(--bg2,#eef2f7);color:var(--text2,#5b6675);font-weight:600}
  .mini{font-size:10.5px;color:var(--text2,#5b6675);font-weight:500}
</style>
</head>
<body>
<header>
  <div class="hl"><a class="logo brand" href="index.html"><img src="logo.png" alt="WinMart+"></a>
    <div><h1 id="h1">DailySale — Doanh thu &amp; Hiệu quả CH</h1><div class="sub" id="sub">Đang tải...</div></div>
  </div>
  <div style="display:flex;gap:8px;align-items:center">
    <nav id="nav"></nav><button class="icon-btn" onclick="toggleTheme()">🌓</button>
  </div>
</header>

<main>
  <div class="filters">
    <div class="seg" id="segSec">
      <button data-v="sale" class="on">Sale</button>
      <button data-v="sl">Tồn kho &amp; S&amp;L</button>
    </div>
    <div class="seg" id="segDim">
      <button data-v="D" class="on">D · Ngày</button>
      <button data-v="W">W · Tuần</button>
      <button data-v="M">M · Tháng</button>
      <button data-v="Y">Y · Năm</button>
    </div>
    <select id="fMien"><option value="">Tất cả Miền</option></select>
    <select id="fGdv"><option value="">Tất cả GĐV</option></select>
    <select id="fTinh"><option value="">Tất cả Tỉnh</option></select>
    <select id="fQlkv"><option value="">Tất cả QLKV</option></select>
    <select id="fType"><option value="">Mọi Store Type</option></select>
    <select id="fDoithu"><option value="">Đối thủ: tất cả</option><option value="co">Có đối thủ ≤1km</option><option value="khong">Không đối thủ</option></select>
    <select id="fStatus"><option value="">Mọi trạng thái</option><option value="Đang hoạt động" selected>Đang hoạt động</option><option value="Sắp khai trương">Sắp khai trương</option></select>
    <button onclick="exportCsv()">📥 Xuất CSV</button>
    <span class="mini" id="cnt"></span>
  </div>

  <div class="kpis" id="kpis"></div>

  <div class="card" style="margin-bottom:14px">
    <div class="ch"><h3 id="grpH">📊 Xem theo</h3>
      <div class="seg" id="segGrp" style="margin-left:auto">
        <button data-v="tinhtrang" class="on">Store Type</button>
        <button data-v="doithu">Đối thủ</button>
        <button data-v="vung">Miền / Vùng</button>
        <button data-v="gdv">GĐV / QLKV</button>
        <button data-v="tinh">Tỉnh</button>
      </div>
    </div>
    <div class="scroll" style="max-height:clamp(240px,38vh,430px)"><table class="tb" id="tblGrp"><thead></thead><tbody></tbody></table></div>
  </div>

  <div class="card">
    <div class="ch"><h3>🏪 Chi tiết cửa hàng</h3><span class="tag" id="tagCnt"></span></div>
    <div class="scroll" style="max-height:clamp(220px,34vh,400px)"><table class="tb" id="tblCh"><thead></thead><tbody></tbody></table></div>
  </div>
</main>
<footer><span>© 2026 WinMart+ Rural</span><span id="foot">Nguồn: BigQuery rural-data-analystic · ops.daily_sales</span></footer>

<script src="common.js"></script>
<script>
buildNav('dailysale.html');

/* ── index các key trong payload (65 cột) ───────────────────────── */
const K = {
  gdv:0, qlkv:1, sap:2, name:3, ttrang:4, tinhtrang:5, khaitruong:6, mien:7, vung:8, tinh:9, quan:10, nhomdt:11,
  dLyBill:12, dLyBs:13, dLySpd:14, dCyBill:15, dCyBs:16, dCySpd:17, targetCD:18,
  wLyBill:19, wLyBs:20, wLySpd:21, wCyBill:22, wCyBs:23, wCySpd:24,
  mLyBill:25, mLyBs:26, mLySpd:27, mLmBill:28, mLmBs:29, mLmSpd:30, mCyBill:31, mCyBs:32, mCySpd:33,
  mtdRev:34, shrink:35, loss:36, coupon:37, totalSL:38, stock:39, cogs30:40,
  lytdBill:42, lytdBs:43, lytdSpd:44, lytdRev:45, ytdBill:46, ytdBs:47, ytdSpd:48, ytdRev:49,
  ytdTarget:50, target:51, targetMTD:52, doithu:64
};
const DIM = {
  D:{label:'Ngày',   bill:'dCyBill', bs:'dCyBs', spd:'dCySpd', lyBill:'dLyBill', lyBs:'dLyBs', lySpd:'dLySpd', tgt:'targetCD'},
  W:{label:'Tuần',   bill:'wCyBill', bs:'wCyBs', spd:'wCySpd', lyBill:'wLyBill', lyBs:'wLyBs', lySpd:'wLySpd'},
  M:{label:'Tháng',  bill:'mCyBill', bs:'mCyBs', spd:'mCySpd', lyBill:'mLyBill', lyBs:'mLyBs', lySpd:'mLySpd', lmSpd:'mLmSpd', rev:'mtdRev', tgt:'targetMTD'},
  Y:{label:'Năm',    bill:'ytdBill', bs:'ytdBs', spd:'ytdSpd', lyBill:'lytdBill', lyBs:'lytdBs', lySpd:'lytdSpd', rev:'ytdRev', tgt:'ytdTarget'}
};

let ROWS=[], VIEW=[], dim='D', sec='sale', grp='tinhtrang', meta={};

function num(v){ return (v==null||isNaN(v))?0:Number(v); }
function pct(a,b){ return (b?a/b*100-100:null); }

async function load(){
  const d = await fetch('dailysale_data.json?'+Date.now()).then(r=>r.json());
  meta = d.meta||{};
  ROWS = d.rows.map(r=>{const o={}; for(const k in K) o[k]=r[K[k]]; return o;});
  document.getElementById('sub').textContent =
    `Báo cáo ${meta.reportDate? meta.reportDate.slice(0,10).split('-').reverse().join('/'):''} · MTD ${meta.mtdDays||''} ngày · ${fmtN(ROWS.length)} CH`;

  const uniq=f=>[...new Set(ROWS.map(f).filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),'vi'));
  fill('fMien',uniq(r=>r.mien)); fill('fGdv',uniq(r=>r.gdv)); fill('fTinh',uniq(r=>r.tinh));
  fill('fQlkv',uniq(r=>r.qlkv)); fill('fType',uniq(r=>r.tinhtrang));
  ['fMien','fGdv','fTinh','fQlkv','fType','fDoithu','fStatus'].forEach(id=>document.getElementById(id).onchange=apply);
  document.querySelectorAll('#segDim button').forEach(b=>b.onclick=()=>{dim=b.dataset.v; segSet('segDim',dim); render();});
  document.querySelectorAll('#segSec button').forEach(b=>b.onclick=()=>{sec=b.dataset.v; segSet('segSec',sec); render();});
  document.querySelectorAll('#segGrp button').forEach(b=>b.onclick=()=>{grp=b.dataset.v; segSet('segGrp',grp); render();});
  apply();
}

function fill(id,arr){ const s=document.getElementById(id), first=s.options[0].textContent;
  s.innerHTML=`<option value="">${first}</option>`+arr.map(v=>`<option>${esc(v)}</option>`).join(''); }
function segSet(id,v){ document.querySelectorAll('#'+id+' button').forEach(b=>b.classList.toggle('on', b.dataset.v===v)); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function apply(){
  const v=id=>document.getElementById(id).value;
  VIEW = ROWS.filter(r=>
    (!v('fMien')||r.mien===v('fMien'))&&(!v('fGdv')||r.gdv===v('fGdv'))&&(!v('fTinh')||r.tinh===v('fTinh'))&&
    (!v('fQlkv')||r.qlkv===v('fQlkv'))&&(!v('fType')||r.tinhtrang===v('fType'))&&(!v('fStatus')||r.ttrang===v('fStatus'))&&
    (!v('fDoithu') || (v('fDoithu')==='co' ? (r.doithu||'').includes('đối thủ ≤1km') : r.doithu==='Không đối thủ'))
  );
  document.getElementById('cnt').textContent = `${fmtN(VIEW.length)} / ${fmtN(ROWS.length)} CH`;
  render();
}

/* ── tổng hợp 1 tập CH ──────────────────────────────────────────── */
function agg(rows){
  const d=DIM[dim];
  const s={n:rows.length, bill:0, rev:0, lyBill:0, lyRev:0, lmRev:0, mtdRev:0, tgt:0, lyTgt:0,
           revM:0, lyRevM:0, billM:0, lyBillM:0, lmRevM:0, nLy:0, revDim:0,
           shrink:0, loss:0, coupon:0, totalSL:0, stock:0, cogs:0, hasTgt:0, hasStock:0, hasSL:0};
  rows.forEach(r=>{
    s.bill+=num(r[d.bill]); s.rev+=num(r[d.spd]); s.lyBill+=num(r[d.lyBill]); s.lyRev+=num(r[d.lySpd]);
    if(d.lmSpd) s.lmRev+=num(r[d.lmSpd]);
    if(d.rev) s.revDim+=num(r[d.rev]);
    if(num(r[d.tgt])>0){ s.tgt+=num(r[d.tgt]); s.hasTgt++; }
    const lyv=num(r[d.lySpd]);
    if(lyv>0){ s.revM+=num(r[d.spd]); s.lyRevM+=lyv; s.billM+=num(r[d.bill]); s.lyBillM+=num(r[d.lyBill]); s.nLy++; }
    if(d.lmSpd && num(r[d.lmSpd])>0) s.lmRevM+=num(r[d.spd]);
    s.shrink+=num(r.shrink); s.loss+=num(r.loss); s.coupon+=num(r.coupon);
    s.mtdRev+=num(r.mtdRev);
    if(num(r.stock)>0){ s.stock+=num(r.stock); s.cogs+=num(r.cogs30); s.hasStock++; }
    if(num(r.mtdRev)>0) s.hasSL++;
  });
  s.bs = s.bill? s.rev/s.bill*1000 : null;
  s.lyBs = s.lyBill? s.lyRev/s.lyBill*1000 : null;
  const bsM = s.billM? s.revM/s.billM*1000 : null, lyBsM = s.lyBillM? s.lyRevM/s.lyBillM*1000 : null;
  s.dSpd = pct(s.revM, s.lyRevM); s.dBill = pct(s.billM, s.lyBillM); s.dBs = pct(bsM, lyBsM);
  s.dLm = d.lmSpd ? pct(s.lmRevM, s.lmRev) : null;
  s.totalSL = -Math.abs(s.shrink) + s.loss;
  s.pctSL = s.mtdRev ? s.totalSL/s.mtdRev*100 : null;
  s.ht = (s.tgt>0) ? ((d.rev? s.revDim : s.rev)/s.tgt*100) : null;
  s.dio = (s.hasStock && s.cogs>0)? s.stock/s.cogs : null;
  return s;
}

/* ── KPI cards ─────────────────────────────────────────────────── */
function renderKpis(){
  const a=agg(VIEW), d=DIM[dim], box=document.getElementById('kpis');
  const card=(k,v,sub,cl)=>`<div class="kpi"><div class="lbl">${k}</div><div class="val ${cl||''}">${v}</div>${sub?`<div class="sub2">${sub}</div>`:''}</div>`;
  let h='';
  h+=card('Cửa hàng', fmtN(a.n), `nguồn ${fmtN(ROWS.length)} CH`);
  h+=card(`SPD · ${d.label} (trđ/ngày)`, fmtN(a.rev,1), `${fmtPct(a.dSpd)} vs LY`, cls(a.dSpd));
  h+=card('Bill/ngày', fmtN(a.bill,0), `${fmtPct(a.dBill)} vs LY`, cls(a.dBill));
  h+=card('BS (nghìn/bill)', fmtN(a.bs,0), `${fmtPct(a.dBs)} vs LY`, cls(a.dBs));
  if(dim==='D') h+=card('%HT target ngày', a.ht==null?'—':fmtN(a.ht,1)+'%', 'SPD ÷ Target CD',
      a.ht==null?'':(a.ht>=100?'pos':(a.ht>=90?'':'neg')));
  if(dim==='W') h+=card('Tổng doanh thu tuần', fmtB(a.rev*7), `${fmtPct(a.dSpd)} vs LY`, cls(a.dSpd));
  if(dim==='M') h+=card('MTD Revenue', fmtB(a.revDim), `%HT MTD ${a.ht==null?'—':fmtN(a.ht,1)+'%'} · ${fmtPct(a.dLm)} vs LM`,
      a.ht==null?'':(a.ht>=100?'pos':'neg'));
  if(dim==='Y') h+=card('YTD Revenue', fmtB(a.revDim), `%HT YTD ${a.ht==null?'—':fmtN(a.ht,1)+'%'}`, a.ht==null?'':(a.ht>=100?'pos':'neg'));
  h+=card('%S&L (MTD)', a.pctSL==null?'—':fmtN(a.pctSL,2)+'%', `S&L ${fmtB(a.totalSL)}`, a.pctSL==null?'':(a.pctSL<-2?'neg':(a.pctSL<0?'':'pos')));
  h+=card('DIO (ngày)', a.dio==null?'—':fmtN(a.dio,1), `Stock ${fmtB(a.stock)}`, a.dio==null?'':(a.dio>45?'neg':'pos'));
  box.innerHTML=h;
}

/* ── bảng nhóm ─────────────────────────────────────────────────── */
const GRP_KEY = {
  tinhtrang: r=>r.tinhtrang||'Chưa phân loại',
  doithu:    r=>(r.doithu||'').includes('≤1km')?'Có đối thủ ≤1km':'Không đối thủ',
  vung:      r=>[r.mien||'—', r.vung||r.tinh||'—'].join(' · '),
  gdv:       r=>[r.gdv||'—', r.qlkv||'—'].join(' · '),
  tinh:      r=>r.tinh||'—'
};

function renderGroup(){
  const d=DIM[dim], key=GRP_KEY[grp];
  document.getElementById('grpH').textContent = sec==='sale'
    ? `📊 Sale · ${d.label} — xem theo ${({tinhtrang:'Store Type',doithu:'Đối thủ',vung:'Miền / Vùng',gdv:'GĐV / QLKV',tinh:'Tỉnh'})[grp]}`
    : `📦 Tồn kho & S&L — xem theo ${({tinhtrang:'Store Type',doithu:'Đối thủ',vung:'Miền / Vùng',gdv:'GĐV / QLKV',tinh:'Tỉnh'})[grp]}`;

  const map=new Map();
  VIEW.forEach(r=>{ const k=key(r); if(!map.has(k)) map.set(k,[]); map.get(k).push(r); });
  const list=[...map.entries()].map(([k,rs])=>({k, a:agg(rs)})).sort((x,y)=>y.a.n-x.a.n);

  let cols, cell;
  if(sec==='sale'){
    cols=[['Nhóm'],['Số CH','num'],['Bill','num'],['BS','num'],['SPD','num'],[`SPD vs LY`,'num']];
    if(dim==='M') cols.push(['MTD Rev','num'],['vs LM','num'],['%HT MTD','num']);
    else if(dim==='Y') cols.push(['YTD Rev','num'],['%HT YTD','num']);
    else if(dim==='D') cols.push(['Target CD','num'],['%HT CD','num']);
    else cols.push(['Rev tuần','num']);
    cell=(a)=>[
      fmtN(a.n), fmtN(a.bill,0), fmtN(a.bs,0), fmtN(a.rev,1),
      `<span class="${cls(a.dSpd)}">${fmtPct(a.dSpd)}</span>`,
      dim==='M'?`${fmtB(a.revDim)}|<span class="${cls(a.dLm)}">${fmtPct(a.dLm)}</span>|<span class="${a.ht>=100?'pos':'neg'}">${a.ht==null?'—':fmtN(a.ht,1)+'%'}</span>`
      : dim==='Y'?`${fmtB(a.revDim)}|<span class="${a.ht>=100?'pos':'neg'}">${a.ht==null?'—':fmtN(a.ht,1)+'%'}</span>`
      : dim==='D'?`${fmtN(a.tgt,0)}|<span class="${a.ht>=100?'pos':(a.ht>=90?'':'neg')}">${a.ht==null?'—':fmtN(a.ht,1)+'%'}</span>`
      : `${fmtB(a.rev*7)}`
    ].join('|').split('|');
  } else {
    cols=[['Nhóm'],['Số CH','num'],['%S&L','num'],['Shrinkage','num'],['Loss','num'],['Total S&L','num'],['Stock','num'],['DIO','num']];
    cell=(a)=>[fmtN(a.n), `<span class="${a.pctSL<-2?'neg':'pos'}">${a.pctSL==null?'—':fmtN(a.pctSL,2)+'%'}</span>`,
      fmtN(a.shrink,1), fmtN(a.loss,1), fmtN(a.totalSL,1), fmtN(a.stock,0), a.dio==null?'—':fmtN(a.dio,1)];
  }
  const tot=agg(VIEW);
  let h='<thead><tr>'+cols.map(c=>`<th class="${c[1]||''}">${c[0]}</th>`).join('')+'</tr></thead><tbody>';
  h+=`<tr class="grp"><td>Tổng cộng</td>${cell(tot).map(v=>`<td class="num">${v}</td>`).join('')}</tr>`;
  list.forEach(o=>{ h+=`<tr><td style="font-weight:600">${esc(o.k)}</td>${cell(o.a).map(v=>`<td class="num">${v}</td>`).join('')}</tr>`; });
  document.getElementById('tblGrp').innerHTML=h+'</tbody>';
}

/* ── bảng chi tiết CH ──────────────────────────────────────────── */
function renderCh(){
  const d=DIM[dim];
  let cols=[['Mã SAP'],['Cửa hàng'],['GĐV'],['QLKV'],['Tỉnh'],['SPD','num'],['vs LY','num'],['Bill','num'],['BS','num']];
  if(dim==='M') cols.push(['MTD Rev','num'],['%HT','num']);
  else if(dim==='Y') cols.push(['YTD Rev','num'],['%HT','num']);
  else if(dim==='D') cols.push(['TargetCD','num'],['%HT','num']);

  const rows=VIEW.slice().sort((a,b)=>num(b[d.spd])-num(a[d.spd]));
  document.getElementById('tagCnt').textContent = fmtN(rows.length)+' CH';
  let h='<thead><tr>'+cols.map(c=>`<th class="${c[1]||''}">${c[0]}</th>`).join('')+'</tr></thead><tbody>';
  rows.slice(0,400).forEach(r=>{
    const spd=num(r[d.spd]), ly=num(r[d.lySpd]), dl=pct(spd,ly), ht=num(r[d.tgt])?spd/num(r[d.tgt])*100:null;
    let extra='';
    if(dim==='M') extra=`<td class="num">${fmtB(num(r.mtdRev))}</td><td class="num ${ht>=100?'pos':'neg'}">${ht==null?'—':fmtN(ht,1)+'%'}</td>`;
    else if(dim==='Y') extra=`<td class="num">${fmtB(num(r.ytdRev))}</td><td class="num ${ht>=100?'pos':'neg'}">${ht==null?'—':fmtN(ht,1)+'%'}</td>`;
    else if(dim==='D') extra=`<td class="num">${fmtN(num(r.targetCD),1)}</td><td class="num ${ht>=100?'pos':(ht>=90?'':'neg')}">${ht==null?'—':fmtN(ht,1)+'%'}</td>`;
    h+=`<tr><td>${esc(r.sap)}</td><td>${esc(r.name)}</td><td>${esc(r.gdv)}</td><td>${esc(r.qlkv)}</td><td>${esc(r.tinh)}</td>`
     + `<td class="num">${fmtN(spd,1)}</td><td class="num ${cls(dl)}">${fmtPct(dl)}</td>`
     + `<td class="num">${fmtN(num(r[d.bill]),0)}</td><td class="num">${fmtN(num(r[d.bs]),0)}</td>${extra}</tr>`;
  });
  document.getElementById('tblCh').innerHTML=h+'</tbody>';
}

function render(){ renderKpis(); renderGroup(); renderCh(); }

function exportCsv(){
  const d=DIM[dim];
  const head=['Ma SAP','Ten CH','GDV','QLKV','Tinh','Store Type','Trang thai','Doi thu',
    `SPD ${d.label}`,'SPD LY','%vs LY','Bill','BS','Rev','Target','%HT','Shrinkage','Loss','TotalSL','Stock','DIO'];
  const lines=[head.join(',')];
  VIEW.forEach(r=>{
    const spd=num(r[d.spd]), ly=num(r[d.lySpd]), tgt=num(r[d.tgt]);
    const rev=num(d.rev? r[d.rev] : spd);
    lines.push([r.sap,r.name,r.gdv,r.qlkv,r.tinh,r.tinhtrang,r.ttrang,r.doithu,
      spd.toFixed(2), ly.toFixed(2), (pct(spd,ly)||0).toFixed(1), num(r[d.bill]).toFixed(0), num(r[d.bs]).toFixed(0),
      rev.toFixed(2), tgt.toFixed(2), tgt?(rev/tgt*100).toFixed(1):'',
      num(r.shrink).toFixed(2), num(r.loss).toFixed(2), num(r.totalSL).toFixed(2), num(r.stock).toFixed(2),
      num(r.cogs30)?(num(r.stock)/num(r.cogs30)).toFixed(1):''
    ].map(x=>`"${String(x==null?'':x).replace(/"/g,'""')}"`).join(','));
  });
  const blob=new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`dailysale_${dim}_${new Date().toISOString().slice(0,10)}.csv`; a.click();
}

load().catch(e=>{document.getElementById('sub').textContent='Lỗi tải dữ liệu: '+e.message;});
</script>
</body>
</html>
